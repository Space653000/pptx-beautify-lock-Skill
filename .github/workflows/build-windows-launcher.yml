name: build-windows-launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
      - 'release/**'
    paths:
      - 'launcher/**'
      - 'BACKUP-pptx-beautify-lock-Skill.bat'
      - '.github/workflows/build-windows-launcher.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build beautify-only GUI executable
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PPTX-Beautify
          --paths launcher
          launcher/pptx_beautify_portable.py

      - name: Execute product-boundary self-test
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/PPTX-Beautify.exe')) { throw 'EXE missing' }
          $process = Start-Process -FilePath (Resolve-Path 'dist/PPTX-Beautify.exe') -ArgumentList '--portable-self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE self-test failed with exit code $($process.ExitCode)" }

      - name: Hash release executable
        shell: pwsh
        run: |
          $hash = Get-FileHash 'dist/PPTX-Beautify.exe' -Algorithm SHA256
          $hash | Format-List
          "SHA256=$($hash.Hash)" | Out-File -Encoding ascii 'dist/SHA256.txt'

      - name: Upload Windows beautifier
        uses: actions/upload-artifact@v4
        with:
          name: PPTX-Beautify-Windows
          path: |
            dist/PPTX-Beautify.exe
            dist/SHA256.txt
            BACKUP-pptx-beautify-lock-Skill.bat
          if-no-files-found: error
