name: build-windows-launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'launcher/**'
      - 'PPTX-Beautify-Lock.cmd'
      - '.github/workflows/build-windows-launcher.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build GUI executable
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PPTX-Beautify-Lock
          launcher/pptx_beautify_gui.py

      - name: Smoke test executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/PPTX-Beautify-Lock.exe')) { throw 'EXE missing' }
          Get-FileHash 'dist/PPTX-Beautify-Lock.exe' -Algorithm SHA256

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PPTX-Beautify-Lock-Windows
          path: dist/PPTX-Beautify-Lock.exe
          if-no-files-found: error
