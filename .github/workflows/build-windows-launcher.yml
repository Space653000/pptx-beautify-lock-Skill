name: build-windows-launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'launcher/**'
      - 'requirements.txt'
      - 'PPTX-Beautify-Lock.cmd'
      - '.github/workflows/build-windows-launcher.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install portable runtime dependencies
        run: python -m pip install --upgrade pyinstaller -r requirements.txt

      - name: Build portable GUI executable
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PPTX-Beautify-Lock
          --paths launcher
          --collect-all pptx
          --collect-all lxml
          --collect-all PIL
          launcher/pptx_beautify_portable.py

      - name: Execute portable runtime self-test
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/PPTX-Beautify-Lock.exe')) { throw 'EXE missing' }
          $process = Start-Process -FilePath (Resolve-Path 'dist/PPTX-Beautify-Lock.exe') -ArgumentList '--portable-self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Portable EXE self-test failed with exit code $($process.ExitCode)" }

      - name: Hash release executable
        shell: pwsh
        run: |
          $hash = Get-FileHash 'dist/PPTX-Beautify-Lock.exe' -Algorithm SHA256
          $hash | Format-List
          "SHA256=$($hash.Hash)" | Out-File -Encoding ascii 'dist/SHA256.txt'

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PPTX-Beautify-Lock-Windows
          path: |
            dist/PPTX-Beautify-Lock.exe
            dist/SHA256.txt
          if-no-files-found: error
