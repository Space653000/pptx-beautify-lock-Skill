name: sync-update-channel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward stable updater branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/fix/separate-skill-exe-backup-v062
